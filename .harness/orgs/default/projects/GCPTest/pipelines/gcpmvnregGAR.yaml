pipeline:
  name: gcp-mvn-reg-GAR
  identifier: gcpmvnregGAR
  projectIdentifier: GCPTest
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: gitall
        repoName: Blue-Green
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.minikubeconn
              namespace: maven
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  name: UploadGAR
                  identifier: UploadGAR
                  template:
                    templateRef: GAR_ALL_Upload
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        connectorRef: <+input>
                        image: <+input>
                        envVariables:
                          artifact_type: <+input>.selectOneFrom(npm,maven)
                          gcp_project: <+input>.selectOneFrom(harness-475313)
                          gar_location: <+input>.selectOneFrom(asia-south1)
                          gar_repo: <+input>.selectOneFrom(gcp-npm-reg,gcp-mvn-snap-reg,gcp-generic,mvn-gcp-reg)
                          artifact_name: <+input>
                          artifact_version: <+input>
                          artifact_Dir_Path: <+input>
              - step:
                  type: Run
                  name: GCP_Auth
                  identifier: GCP_Auth
                  spec:
                    connectorRef: account.Dockerhub
                    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
                    shell: Sh
                    command: |-
                      echo "Authenticating with Google Cloud..."
                      python3 - <<'EOF'
                      import os, json
                      key = os.environ.get("GCP_KEY_JSON")
                      if not key:
                        raise SystemExit("Missing GCP_KEY_JSON")
                      key_json = json.loads(key)
                      with open("/harness/gcp-key.json", "w") as f:
                        json.dump(key_json, f)
                      EOF

                      gcloud auth activate-service-account --key-file=/harness/gcp-key.json
                      gcloud config set project harness-475313

                      gcloud auth list

                      # gcloud artifacts repositories list --location=asia-south1
                      # cat /harness/gcp-key.json
                      # export GOOGLE_APPLICATION_CREDENTIALS=/harness/gcp-key.json
                    envVariables:
                      GCP_KEY_JSON: <+secrets.getValue("gcp-sa")>
                  when:
                    stageStatus: Success
                    condition: "false"
              - step:
                  type: Run
                  name: Build_And_Push_To_Gar
                  identifier: Build_And_Push_To_Gar
                  spec:
                    connectorRef: account.Dockerhub
                    image: maven:3-openjdk-17
                    shell: Bash
                    command: |-
                      echo "Using service account key from /harness/gcp-key.json"
                      export GOOGLE_APPLICATION_CREDENTIALS=/harness/gcp-key.json

                      ENCODED_KEY=$(base64 -w0 /harness/gcp-key.json)

                      mvn clean deploy \
                        -DskipTests \
                        -DaltDeploymentRepository=artifact-registry::default::https://_json_key_base64:${ENCODED_KEY}@asia-south1-maven.pkg.dev/harness-475313/gcp-mvn-snap-reg
                        # -DpomFile=pom.xml -Dfile=target/*.jar
                        # -Dgcp.service.account.file=/tmp/gcp-key.json \
                        # -Dgcp.project.id=harness-475313

                      echo "✅ JAR uploaded successfully!......"
                  when:
                    stageStatus: Success
                    condition: "false"
              - step:
                  type: BuildAndPushGAR
                  name: BuildAndPushImageToGAR
                  identifier: BuildAndPushImageToGAR
                  spec:
                    connectorRef: gcpconntest
                    host: asia-south1-docker.pkg.dev
                    projectID: harness-475313/gcp-docker-reg
                    imageName: bankapp
                    tags:
                      - <+pipeline.variables.TAG>
                    caching: true
                  when:
                    stageStatus: Success
                    condition: "false"
  variables:
    - name: TAG
      type: String
      description: ""
      required: true
      value: <+input>
